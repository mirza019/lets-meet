services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: letsmeet
      POSTGRES_USER: letsmeet
      POSTGRES_PASSWORD: letsmeet_dev
    ports: ["5432:5432"]
    volumes: ["letsmeet_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U letsmeet"], interval: 5s, timeout: 5s, retries: 10}
volumes: {letsmeet_data: {}}
